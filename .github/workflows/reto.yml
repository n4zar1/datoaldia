name: Seguidores del reto
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/reto.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - run: |
          git add reto.json
          git diff --cached --quiet && exit 0
          git -c user.name=n4zar1 -c user.email=n4zar1.cyber@gmail.com commit -m "Actualiza seguidores del reto"
          git push
